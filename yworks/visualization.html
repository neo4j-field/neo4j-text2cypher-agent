<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yFiles Visualization</title>
    <style>
        /* yFiles CSS will be injected here */
        {{CSS_CONTENT}}
        
        /* Custom styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }
        
        #graphComponent {
            width: 100%;
            height: 100vh;
            background: white;
        }
    </style>
</head>
<body>
    <div id="graphComponent"></div>
    
    <!-- yFiles Bundle -->
    <script>
        {{BUNDLE_CONTENT}}
    </script>
    
    <!-- Main Visualization Script -->
    <script>
        // License registration
        const license = {{LICENSE_CONTENT}};
        if (yfiles.License) {
            yfiles.License.value = license;
        }
        
        // Initialize graph component
        let graphComponent;
        let graph;
        
        function initializeGraph() {
            // Create the graph component
            graphComponent = new yfiles.view.GraphComponent('#graphComponent');
            graph = graphComponent.graph;
            
            // Set up input mode for interaction
            const inputMode = new yfiles.view.GraphEditorInputMode();
            graphComponent.inputMode = inputMode;
            
            // Configure default styles
            graph.nodeDefaults.style = new yfiles.view.ShapeNodeStyle({
                fill: '#007bff',
                stroke: '#0056b3',
                shape: 'round-rectangle'
            });
            
            graph.edgeDefaults.style = new yfiles.view.PolylineEdgeStyle({
                stroke: '2px #666',
                targetArrow: new yfiles.view.Arrow({
                    type: 'triangle',
                    stroke: '#666',
                    fill: '#666'
                })
            });
        }
        
        // Main function to load Neo4j data
        window.loadNeo4jData = function(data) {
            if (!graphComponent) {
                initializeGraph();
            }
            
            // Clear existing graph
            graphComponent.graph.clear();
            
            // Check if GraphBuilder is available
            if (!yfiles.graph || !yfiles.graph.GraphBuilder) {
                console.error('GraphBuilder not available');
                return;
            }
            
            const GraphBuilder = yfiles.graph.GraphBuilder;
            
            // Create GraphBuilder instance
            const graphBuilder = new GraphBuilder(graphComponent.graph);
            
            // Create nodes source
            if (data.nodes && data.nodes.length > 0) {
                const nodesSource = graphBuilder.createNodesSource(
                    data.nodes,
                    'id'  // Use 'id' property as node identifier
                );
                
                // Add labels to nodes
                if (nodesSource.nodeCreator) {
                    nodesSource.nodeCreator.createLabelBinding('label');
                }
            }
            
            // Create edges source
            if (data.edges && data.edges.length > 0) {
                const edgesSource = graphBuilder.createEdgesSource({
                    data: data.edges,
                    sourceId: 'source',  // Property for source node ID
                    targetId: 'target'   // Property for target node ID
                });
            }
            
            // Build the graph
            graphBuilder.buildGraph();
            
            // Apply organic layout
            if (yfiles.layout && yfiles.layout.OrganicLayout) {
                const layout = new yfiles.layout.OrganicLayout();
                graphComponent.graph.applyLayout(layout);
            }
            
            // Fit the graph in view
            graphComponent.fitGraphBounds();
        };
        
        // Initialize when ready
        if (typeof yfiles !== 'undefined') {
            initializeGraph();
        }
    </script>
</body>
</html>
